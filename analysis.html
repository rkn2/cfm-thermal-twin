<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Centre Furnace Mansion · Thermal analysis</title><style>
:root{
  --bg:#f3f5f3;--surface:#fff;--ink:#16211c;--ink-2:#4a5550;--muted:#7a847f;--line:#dfe4e0;--grid:#edf0ee;
  --accent:#1f5c4a;--accent-soft:#e4eee9;--good:#0ca30c;--warn:#d99a00;--warn-ink:#8a6200;--crit:#d03b3b;--none:#9aa39e;
  --good-bg:#e5f4e5;--warn-bg:#fbf0d4;--crit-bg:#fbe6e6;--chk:#fff4c2;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101513;--surface:#181f1c;--ink:#edf2ef;--ink-2:#b6c1bb;--muted:#87928c;--line:#2a332f;--grid:#222a26;
  --accent:#7cc3a8;--accent-soft:#1e2b25;--warn:#fab219;--warn-ink:#fab219;--crit:#e66767;--none:#5a645f;
  --good-bg:#16301a;--warn-bg:#33290f;--crit-bg:#3a1c1c;--chk:#3a3314}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101513;--surface:#181f1c;--ink:#edf2ef;--ink-2:#b6c1bb;--muted:#87928c;--line:#2a332f;--grid:#222a26;
  --accent:#7cc3a8;--accent-soft:#1e2b25;--warn:#fab219;--warn-ink:#fab219;--crit:#e66767;--none:#5a645f;
  --good-bg:#16301a;--warn-bg:#33290f;--crit-bg:#3a1c1c;--chk:#3a3314}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0;padding:0 16px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-block:22px 48px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.pagelink{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-decoration:none}
.pagelink:hover{border-color:var(--accent)}
.pagelink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.status{margin:0;font-size:15px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.status strong{color:var(--ink);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.stagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font-size:12px;background:none;border:0;padding:6px 11px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sheets{display:flex;flex-wrap:wrap;gap:6px}
.sheets button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
.sheets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.sheets button .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.viewctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.viewctl select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.view{position:relative;height:min(74vh,820px);min-height:400px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#v3d{background:#15191c}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#vsheet{background:#fff;cursor:grab;touch-action:none}
#vsheet.drag{cursor:grabbing} #vsheet.placing{cursor:crosshair}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
#board img{display:block;user-select:none;-webkit-user-drag:none;max-width:none}
#board svg{position:absolute;inset:0;overflow:visible}
.pin{cursor:pointer}
.pin circle{stroke:#fff;stroke-width:3}
.pin text{font:700 15px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.sel circle{stroke:#16211c;stroke-width:5}
.pin.approx circle{stroke-dasharray:5 4}
.overlay{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.overlay>*{pointer-events:auto}
.tool{background:rgba(22,33,28,.86);color:#fff;border:0;border-radius:6px;padding:6px 10px;font:600 12px var(--sans);display:inline-flex;align-items:center;gap:8px}
button.tool{cursor:pointer}
.tool input[type=range]{width:120px;accent-color:#7cc3a8}
.tool .cm{background:none;border:0;color:#c9d1cc;font:600 12px var(--sans);padding:2px 6px;border-radius:4px;cursor:pointer}
.tool .cm[aria-pressed="true"]{background:#7cc3a8;color:#16211c}
.thleg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px} .thleg .g{width:140px;height:9px;border-radius:3px;background:linear-gradient(90deg,#000004,#1b0c41,#4a0c6b,#781c6d,#a52c60,#cf4446,#ed6925,#fb9b06,#fcffa4)}
.tool input[type=number]{width:52px;font:600 12px var(--mono);background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:1px 4px}
#thread{font-family:var(--mono);min-width:13ch}
.frames{display:flex;flex-wrap:wrap;gap:6px}
.frames button{font:500 11px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--ink-2)}
.frames button:hover{border-color:var(--accent);color:var(--accent)}
.devleg{display:inline-flex;align-items:center;gap:6px} .devleg .g{width:120px;height:9px;border-radius:3px;background:linear-gradient(90deg,#2a78d6,#f0efec,#e34948)}
.bottom{top:auto;bottom:10px}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;z-index:3;max-width:calc(100% - 20px)}
.banner button{background:rgba(255,255,255,.18);border:0;border-radius:5px;padding:3px 8px;color:#fff;cursor:pointer;font-size:12px}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:#c9d1cc;font-size:14px;text-align:center;padding:16px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.legend .hint{color:var(--muted);margin-left:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;align-content:start;min-width:0;max-height:calc(74vh + 120px);overflow:auto}
.panel h2{font-size:18px}
.panel h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.back{justify-self:start;background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:9px 6px;border:0;border-top:1px solid var(--grid);background:none;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .name{font-weight:500}
.row .meta{font-size:12px;color:var(--muted);grid-column:2/-1}
.badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.hi{background:var(--good)} .md{background:var(--warn)} .lo{background:var(--crit)} .na{background:var(--none)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.hi{color:var(--good);background:var(--good-bg)} .pill.md{color:var(--warn-ink);background:var(--warn-bg)} .pill.lo{color:var(--crit);background:var(--crit-bg)}
.pill.open{color:var(--muted);background:var(--grid)} .pill.confirmed{color:var(--good);background:var(--good-bg)} .pill.revise{color:var(--warn-ink);background:var(--warn-bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs button{padding:0;border:0;background:none;cursor:zoom-in}
.thumbs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.thumbs figcaption{font:10px var(--mono);color:var(--muted);text-align:center}
.thumbs figure{margin:0}
dl{margin:0;display:grid;gap:3px} dt{font-weight:600;font-size:12px;color:var(--muted);margin-top:6px} dd{margin:0}
.chk{background:var(--chk);padding:2px 6px;border-radius:3px}
textarea{width:100%;min-height:70px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink);resize:vertical}
.small{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
ul.plain,ol.plain{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
#lb{position:fixed;inset:0;background:rgba(10,12,14,.9);display:grid;place-items:center;padding:16px;z-index:20;cursor:zoom-out}
#lb img{max-width:min(960px,100%);max-height:84vh} #lb p{color:#ddd;margin:8px 0 0;text-align:center;font-family:var(--mono);font-size:12px}
.about{max-width:80ch;font-size:13px;color:var(--ink-2)}
</style></head><body><script>
let KEY = null;
async function cfmDecrypt(buf){ const u = new Uint8Array(buf); return crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, KEY, u.slice(12)); }
window.CFM = { grab: async (path, kind) => { const r = await fetch(path + ".enc"); if (!r.ok) throw new Error("HTTP " + r.status + " for " + path);
  const plain = await cfmDecrypt(await r.arrayBuffer()); if (kind === "json") return JSON.parse(new TextDecoder().decode(plain));
  if (kind === "blob") return new Blob([plain], {type: path.endsWith(".png") ? "image/png" : path.endsWith(".pdf") ? "application/pdf" : "image/jpeg"}); return plain; } };
async function boot(){
  const html = new TextDecoder().decode(await cfmDecrypt(await (await fetch("analysis.html.enc")).arrayBuffer()));
  const nav = "<style>#cfmnav{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:10px 16px;background:#16211c;font:600 13px 'Public Sans',system-ui,-apple-system,sans-serif}#cfmnav a{color:#dfe9e3;text-decoration:none;padding:5px 10px;border-radius:6px}#cfmnav a:hover{background:rgba(255,255,255,.12)}#cfmnav a[aria-current]{background:#7cc3a8;color:#16211c}#cfmnav a:focus-visible{outline:2px solid #7cc3a8;outline-offset:2px}</style><nav id=\"cfmnav\" aria-label=\"Centre Furnace Mansion pages\"><a href=\"./\">3D twin</a><a href=\"analysis.html\" aria-current=\"page\">Thermal analysis</a><a href=\"drawings.html\">Drawings</a><a href=\"floors.html\">Floor levels</a><a href=\"plumb.html\">Wall plumbness</a><a href=\"roof.html\">Roof survey</a></nav>";
  const doc = /^\s*<!doctype/i.test(html) ? html.replace(/<body([^>]*)>/i, "<body$1>" + nav)
    : '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body style="padding:0;margin:0">' + nav + html + '</body></html>';
  document.open(); document.write(doc); document.close();
}
</script>
<div id="gate" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px">
  <form id="gateform" style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px;width:min(380px,100%)">
    <div class="eyebrow">Penn State Heritage 3D Lab</div>
    <h1 style="font-size:22px">Centre Furnace Mansion · thermal analysis</h1>
    <label for="pw" class="small">Enter the password to view.</label>
    <input id="pw" type="password" autocomplete="current-password" required style="font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)">
    <label class="small" style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked> Remember on this device for 30 days</label>
    <button class="btn primary" type="submit" style="font-size:14px;padding:9px">View</button>
    <p id="gatemsg" class="small" role="alert" style="margin:0;min-height:1.2em"></p>
  </form>
</div>
<script>
(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let G = null; let gateReady = null;
  async function tryKey(k){ const u = b64(G.check); try { await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, k, u.slice(12)); return true; } catch(e){ return false; } }
  async function open(k){ KEY = k; document.getElementById("gate").remove(); boot(); }
  async function derive(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(G.salt), iterations:G.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  gateReady = (async () => { G = await (await fetch("gate.json")).json(); return G; })();
  (async () => {
    try { await gateReady; } catch(e){ document.getElementById("gatemsg").textContent = "Could not load the page: " + e.message; return; }
    try { const s = JSON.parse(localStorage.getItem("cfm-twin-key") || "null");
      if (s && s.exp > Date.now() && s.salt === G.salt){ const k = await crypto.subtle.importKey("raw", b64(s.k), "AES-GCM", false, ["decrypt"]); if (await tryKey(k)) return open(k); } } catch(e){}
    document.getElementById("pw").focus();
  })();
  document.getElementById("gateform").addEventListener("submit", async e => {
    e.preventDefault(); const msg = document.getElementById("gatemsg"); msg.textContent = "Checking…";
    try { await gateReady; } catch(err){ msg.textContent = "Could not load the page: " + err.message; return; }
    const k = await derive(document.getElementById("pw").value);
    if (!(await tryKey(k))){ msg.textContent = "That password didn't work. Check it and try again."; return; }
    if (document.getElementById("remember").checked){ try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k));
      localStorage.setItem("cfm-twin-key", JSON.stringify({k: btoa(String.fromCharCode(...raw)), salt: G.salt, exp: Date.now() + 30*864e5})); } catch(e){} }
    open(k);
  });
})();
</script>
